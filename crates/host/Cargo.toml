[package]
name = "lucent-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
lucent-protocol.workspace = true
ruffle_core.workspace = true
ruffle_render_wgpu.workspace = true

async-channel = "2.5"
async-task = "4.7"
encoding_rs = "0.8.35"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "native-tls", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
tracing = "0.1"
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
raw-window-handle = "0.6"
