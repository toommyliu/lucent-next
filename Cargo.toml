[workspace]
exclude = ["vendor/zed"]
resolver = "3"
members = [
    "crates/host",
    "crates/protocol",
    "crates/runtime",
    "crates/ui",
    "crates/app",
]

[workspace.package]
edition = "2024"
publish = false
version = "0.0.0"

[workspace.dependencies]
lucent-host = { path = "crates/host" }
lucent-protocol = { path = "crates/protocol" }
lucent-runtime = { path = "crates/runtime" }
lucent-ui = { path = "crates/ui" }

gpui = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba", default-features = false, features = ["wayland", "x11"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a246efd7e1b83ab568ec5e3e6c1a43a42e1abba", features = ["font-kit", "wayland", "x11"] }

ruffle_core = { git = "https://github.com/toommyliu/ruffle", rev = "c59cb1ac1bd82aaa176cd24fd23c8fefb7b8c074", features = [
    "aac",
    "audio",
    "default_compatibility_rules",
    "default_font",
    "lzma",
    "mp3",
    "nellymoser",
] }
ruffle_render = { git = "https://github.com/toommyliu/ruffle", rev = "c59cb1ac1bd82aaa176cd24fd23c8fefb7b8c074" }
ruffle_render_wgpu = { git = "https://github.com/toommyliu/ruffle", rev = "c59cb1ac1bd82aaa176cd24fd23c8fefb7b8c074" }
ruffle_frontend_utils = { git = "https://github.com/toommyliu/ruffle", rev = "c59cb1ac1bd82aaa176cd24fd23c8fefb7b8c074", default-features = false, features = ["cpal", "fs"] }
swf = { git = "https://github.com/toommyliu/ruffle", rev = "c59cb1ac1bd82aaa176cd24fd23c8fefb7b8c074" }

[patch.crates-io]
naga = { git = "https://github.com/toommyliu/ruffle", rev = "c59cb1ac1bd82aaa176cd24fd23c8fefb7b8c074" }
wgpu-core = { git = "https://github.com/toommyliu/ruffle", rev = "c59cb1ac1bd82aaa176cd24fd23c8fefb7b8c074" }
wgpu-hal = { git = "https://github.com/toommyliu/ruffle", rev = "c59cb1ac1bd82aaa176cd24fd23c8fefb7b8c074" }
wgpu-types = { git = "https://github.com/toommyliu/ruffle", rev = "c59cb1ac1bd82aaa176cd24fd23c8fefb7b8c074" }


[patch."https://github.com/zed-industries/zed"]
collections = { path = "vendor/zed/crates/collections" }
gpui = { path = "vendor/zed/crates/gpui" }
gpui_linux = { path = "vendor/zed/crates/gpui_linux" }
gpui_macos = { path = "vendor/zed/crates/gpui_macos" }
gpui_macros = { path = "vendor/zed/crates/gpui_macros" }
gpui_platform = { path = "vendor/zed/crates/gpui_platform" }
gpui_shared_string = { path = "vendor/zed/crates/gpui_shared_string" }
gpui_util = { path = "vendor/zed/crates/gpui_util" }
gpui_web = { path = "vendor/zed/crates/gpui_web" }
gpui_wgpu = { path = "vendor/zed/crates/gpui_wgpu" }
gpui_windows = { path = "vendor/zed/crates/gpui_windows" }
http_client = { path = "vendor/zed/crates/http_client" }
media = { path = "vendor/zed/crates/media" }
refineable = { path = "vendor/zed/crates/refineable" }
derive_refineable = { path = "vendor/zed/crates/refineable/derive_refineable" }
scheduler = { path = "vendor/zed/crates/scheduler" }
sum_tree = { path = "vendor/zed/crates/sum_tree" }
util_macros = { path = "vendor/zed/crates/util_macros" }
zlog = { path = "vendor/zed/crates/zlog" }
ztracing = { path = "vendor/zed/crates/ztracing" }
ztracing_macro = { path = "vendor/zed/crates/ztracing_macro" }
perf = { path = "vendor/zed/tooling/perf" }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
